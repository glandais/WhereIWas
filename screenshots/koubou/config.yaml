# App Store screenshot cards — Koubou sources.
#
# Run from the repository root:
#   kou generate screenshots/koubou/config.yaml --output json
#
# Every path below is resolved relative to THIS file, not to the working directory.
#
# Inputs  : screenshots/flat/<locale>/NN-*.png   (produced by ./scripts/screenshots.sh, gitignored)
# Outputs : screenshots/koubou/out/<locale>/<device>/NN-*.png (gitignored)
#           they still have to be copied into screenshots/IPHONE_65/<locale>/ for `asc screenshots upload`.
#
# The device frame is a 17 Pro Max because that is the simulator the captures come from
# (scripts/sim-config.sh) — Deep Blue is the dark finish and the one that sits closest to the
# icon's navy. The locale list is the App Store Connect namespace, matching the flat/ directories.

project:
  name: "WhereIWas"
  output_dir: "out"
  device: "iPhone 17 Pro Max - Deep Blue - Portrait"
  output_size: "iPhone6_5"

localization:
  base_language: "en-US"
  languages: ["en-US", "fr-FR", "de-DE", "es-ES", "it", "ja", "nl-NL", "pl", "cs"]
  xcstrings_path: "koubou-strings.xcstrings"

screenshots:

  # 1 — the payoff first: the timeline the whole app exists to build. It leads because the first
  # three cards show in search results, and this is the one a traveller recognises at a glance.
  01-map:
    template: "templates/01-map-slab.html"
    variables:
      headline: "Your location timeline"
      subtitle: "Every trip, day by day, street by street."
    assets:
      app_screenshot: "../flat/01-map.png"

  # 2 — it records when you are not looking.
  02-status-moving:
    template: "templates/02-hero-record.html"
    variables:
      headline: "Logs every trip, screen off"
      subtitle: "Keeps recording through reboots and no signal."
    assets:
      app_screenshot: "../flat/02-status-moving.png"

  # 3 — the differentiator: the same screen making the opposite argument.
  03-status-stationary:
    template: "templates/03-split-motion.html"
    variables:
      headline: "GPS runs only while you move"
      subtitle: "All-day battery: stand still and it switches off."
    assets:
      app_screenshot: "../flat/03-status-stationary.png"

  # 4 — ownership. Frame dropped, one card lifted out of the export screen.
  04-export:
    template: "templates/04-export-card.html"
    frame: false
    variables:
      headline: "Export your trips as GPX"
      subtitle: "Or JSON. Nothing leaves your iPhone unless you share it."
    assets:
      app_screenshot: "../flat/04-export.png"

  # 5 — proof, for whoever reads this far. Frame dropped so the log rows stay readable (see the
  # template header).
  05-audit-trail:
    template: "templates/05-audit-band.html"
    frame: false
    variables:
      headline: "Every point, explained"
      subtitle: "Why each GPS position was kept or dropped."
    assets:
      app_screenshot: "../flat/05-audit-trail.png"
