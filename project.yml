name: WhereIWas
options:
  bundleIdPrefix: io.github.glandais
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "7Q49262697"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WhereIWas:
    type: application
    platform: iOS
    sources:
      - path: WhereIWas
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.glandais.whereiwas
        PRODUCT_NAME: WhereIWas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    info:
      path: WhereIWas/Info.plist
      properties:
        CFBundleDisplayName: WhereIWas
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - processing
          - fetch
        NSLocationAlwaysAndWhenInUseUsageDescription: "WhereIWas records your position continuously, including in the background, so that your movements during a deployment are never lost. Data stays on this device until you export it."
        NSLocationWhenInUseUsageDescription: "WhereIWas records your position to build your location history."
        NSMotionUsageDescription: "Motion activity (walking, driving, still) is used to switch GPS on only when you are moving, which saves battery."
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.glandais.whereiwas.maintenance
        ITSAppUsesNonExemptEncryption: false
  WhereIWasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhereIWasTests
    dependencies:
      - target: WhereIWas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.glandais.whereiwas.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhereIWas.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WhereIWas"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WhereIWas:
    build:
      targets:
        WhereIWas: all
        WhereIWasTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhereIWasTests
      gatherCoverageData: false
    archive:
      config: Release
