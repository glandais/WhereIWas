name: WhereIWas
options:
  bundleIdPrefix: io.github.glandais
  developmentLanguage: en
  knownRegions:
    - en
    - fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# `Screenshots` is a Debug clone whose only difference is the SCREENSHOTS
# compilation condition: the demo controller and every launch-argument hook
# live under `#if SCREENSHOTS`, so none of it reaches the archived Release
# binary. Debug and Release have to be listed too — declaring `configs` at all
# replaces XcodeGen's implicit pair.
configs:
  Debug: debug
  Screenshots: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "7Q49262697"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Screenshots:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SCREENSHOTS"
targets:
  WhereIWas:
    type: application
    platform: iOS
    sources:
      - path: WhereIWas
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.glandais.whereiwas
        PRODUCT_NAME: WhereIWas
        # XcodeGen defaults iOS targets to "1,2"; iPhone-only has to be set here.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    info:
      path: WhereIWas/Info.plist
      properties:
        CFBundleDisplayName: WhereIWas
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - processing
          - fetch
        NSLocationAlwaysAndWhenInUseUsageDescription: "WhereIWas records your position continuously, including in the background, so that your movements during a deployment are never lost. Data stays on this device until you export it."
        NSLocationWhenInUseUsageDescription: "WhereIWas records your position to build your location history."
        NSMotionUsageDescription: "Motion activity (walking, driving, still) is used to switch GPS on only when you are moving, which saves battery."
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.glandais.whereiwas.maintenance
        ITSAppUsesNonExemptEncryption: false
  WhereIWasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhereIWasTests
    dependencies:
      - target: WhereIWas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.glandais.whereiwas.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhereIWas.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WhereIWas"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WhereIWas:
    build:
      targets:
        WhereIWas: all
        WhereIWasTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhereIWasTests
      gatherCoverageData: false
    archive:
      config: Release
  # Used by scripts/screenshots.sh; never archive with this one.
  WhereIWas-Screenshots:
    build:
      targets:
        WhereIWas: [run, build]
    run:
      config: Screenshots
